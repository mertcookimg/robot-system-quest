# Checks every pull request and push. A push to main (or a manual run on main)
# publishes to GitHub Pages only after every check in `verify` has passed,
# using the exact build that was verified.

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  # Publish only from main, never from pull requests.
  PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        # High/critical advisories fail unless reviewed in scripts/audit-check.mjs.
        run: node scripts/audit-check.mjs

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # Analytics is compiled only into the build that will be published.
          VITE_GA_ID: ${{ env.PUBLISH == 'true' && vars.GA_MEASUREMENT_ID || '' }}

      - name: Upload Pages artifact
        if: env.PUBLISH == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./dist

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    concurrency:
      group: pages
      cancel-in-progress: true

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
